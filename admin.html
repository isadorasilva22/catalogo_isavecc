<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel='icon' type="image/icon" href="imagens/logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="container">

<a href="index.html">
<img src="imagens/logo.png" class="logo">
</a>

<a href="inventario.html" class="verInventario">
Ver Inventário
</a>

</div>

</header>

<div class="painelAdmin">

<div id="loginSection">

<h1>Login</h1>

<form id="formLogin">

<label>E-mail</label>

<input
type="email"
id="loginEmail"
required>

<label>Senha</label>

<input
type="password"
id="loginSenha"
required>

<p id="loginErro" class="erro"></p>

<button>

Entrar

</button>

</form>

</div>

<div id="cadastroSection" class="oculto">

<div class="topoAdmin">

<h1 id="tituloForm">Novo Bichinho</h1>

<div class="usuarioBox">

<span id="usuarioLogado"></span>

<button type="button" id="btnLogout" class="logout">
Sair
</button>

</div>

</div>

<div class="categoriasSection">

<h2>Categorias</h2>

<form id="formCategoria" class="formInline">

<input
type="text"
id="novaCategoria"
placeholder="Nova categoria"
required>

<button type="submit">
Adicionar
</button>

</form>

<div id="listaCategorias" class="listaCategorias"></div>

</div>

<form id="formCadastro">

<label>Título</label>

<input
type="text"
id="titulo"
required>

<label>Categoria</label>

<div class="campoSeletor">

<input
type="text"
id="categoria"
placeholder="Selecione uma categoria..."
readonly
required>

<i class="fa-solid fa-chevron-down"></i>

</div>

<label>Cor</label>

<input
type="text"
id="cor"
required>

<label>Imagem</label>

<div class="uploadImagem">

<label for="imagem" class="btnUpload">
<i class="fa-solid fa-upload"></i>
Escolher imagem
</label>

<span id="nomeArquivo" class="nomeArquivo">Nenhum arquivo selecionado</span>

<input
type="file"
id="imagem"
accept="image/*"
class="inputOculto"
required>

</div>

<img
id="preview"
style="display:none;">

<p id="statusForm"></p>

<div class="acoesForm">

<button type="button" id="btnCancelarEdicao" class="cancelar oculto">
Cancelar edição
</button>

<button type="submit" id="btnSalvar">

Salvar

</button>

</div>

</form>

<div class="listaWrapper">

<h2>Bichinhos cadastrados</h2>

<div id="listaBichinhos" class="listaBichinhos"></div>

</div>

</div>

</div>

<div id="modalCategorias" class="modalConfirmacao">

<div class="modalConfirmacaoContent modalCategoriasContent">

<h3>Selecionar categoria</h3>

<div id="listaCategoriasModal" class="listaCategoriasModal"></div>

<div class="modalConfirmacaoAcoes">

<button type="button" id="btnFecharModalCategorias" class="cancelar">
Fechar
</button>

</div>

</div>

</div>

<div id="modalConfirmacao" class="modalConfirmacao">

<div class="modalConfirmacaoContent">

<h3 id="modalConfirmacaoTitulo">Confirmar exclusão</h3>

<p id="modalConfirmacaoTexto"></p>

<div class="modalConfirmacaoAcoes">

<button type="button" id="btnCancelarConfirmacao" class="cancelar">
Cancelar
</button>

<button type="button" id="btnConfirmarExclusao" class="confirmarExclusao">
Excluir
</button>

</div>

</div>

</div>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/admin.js"></script>

</body>

</html>
