<!DOCTYPE html>
<html lang="pt-BR">

<head>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<h1>Novo Bichinho</h1>

<form id="formCadastro">

<label>Título</label>

<input
type="text"
id="titulo"
required>

<label>Categoria</label>

<input
type="text"
id="categoria"
required>

<label>Cor</label>

<input
type="text"
id="cor"
required>

<label>Imagem</label>

<input
type="file"
id="imagem"

required>

id="preview"

<button>

Salvar

</button>

</form>

</div>

src="js/admin.js">

</script>
