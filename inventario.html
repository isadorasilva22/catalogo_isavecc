<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventário | Catálogo de Bichinhos 3D</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inventario.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel='icon' type="image/icon" href="imagens/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="container">

<a href="index.html">

<img src="imagens/logo.png" class="logo">

</a>

<div class="pesquisa">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="pesquisa"
placeholder="Pesquisar bichinho...">

</div>

<a href="admin.html" class="btnLogin">
    <i class="fa-solid fa-lock"></i>
        Administração
</a>

</div>


</header>

<main class="layout">

    <aside class="sidebar">

        <h3>Categorias</h3>

        <button class="ativo" data-categoria="Todos">
            Todos
        </button>

        <button type="button" id="btnFiltroFavoritos">
            <i class="fa-solid fa-star"></i> Favoritos
        </button>

        <div id="listaCategoriasFiltro"></div>

    </aside>

    <section class="conteudo">

        <div class="titulo">

            <h1>Inventário</h1>

            <span id="contador">
                0 bichinhos
            </span>

        </div>

        <section id="cards" class="cards"></section>

    </section>

</main>

<div id="modal" class="modal">

<div class="modal-content">

<div class="modal-header">

<button id="fechar" class="close">&times;</button>

</div>

<div class="modal-grid">

<div class="modal-image">

<img id="modalImagem">

</div>

<div class="modal-info">

<h2 id="modalNome"></h2>

<div class="modal-badges">

<span class="categoria-badge" id="modalCategoria"></span>

<span class="favorito-badge" id="modalFavorito">
<i class="fa-solid fa-star"></i> Favorito
</span>

</div>

<div class="info-item">

<strong>Cor</strong>

<span id="modalCor"></span>

</div>

</div>

</div>

</div>

</div>

<script type="module" src="js/inventario.js"></script>

</body>

</html>
