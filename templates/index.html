<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Bichinhos 3D</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>

    <h1>?? Catálogo 3D</h1>

    <p>Os bichinhos mais fofos da internet</p>

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar bichinho..."
    >

</header>

<main>

    <div class="grid">

        {% for animal in animais %}

        <a
            href="/animal/{{ animal.id }}"
            class="card"
        >

            <img
                src="{{ url_for('static', filename='uploads/' + animal.imagem) }}"
                alt="{{ animal.nome }}"
            >

            <div class="info">

                <h2>{{ animal.nome }}</h2>

                <span>{{ animal.categoria }}</span>

            </div>

        </a>

        {% endfor %}

    </div>

</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
